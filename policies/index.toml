# The kept walks JBrain's Body tab offers. Its "Trained walks" sheet has a Refresh that
# reads this file from main, and the box's library then matches it: a new entry is added,
# an entry whose file changed is updated in place (the owner's name and choices for it
# stay), and an entry taken out is removed from the library.
#
# Keep a run with scripts/keep_policy.sh, which copies it to policies/<slug>/ and prints
# the entry to paste here. Only runs worth driving belong here (owner, 2026-11-14: "the
# ones we pick").
#
#   slug   a-z, 0-9 and - (1-48): the folder, and how the box tells entries apart
#   title  the name the Body tab shows first (up to 60 characters). It starts with the
#          job's name and the run's version as the Jobs screen shows them ("Look v10" is
#          growbot_look's run v10), so a walk and the run it came from read the same
#          (owner, 2026-11-15); the run's note on the box says what it was kept as
#   job    the growbot_ training job that made it; the Body tab groups walks by it
#   file   the policy JSON, policies/<folder>/<name>.json
#   run    optional: the Jobs run id it came from
#   notes  optional
#
# tests/test_policies_index.py checks this file the way the box does.

[[policy]]
slug = "look-v6"
title = "Look v6: turn on the spot to face a target"
job = "growbot_look"
file = "policies/look-v6/policy_look.json"
run = "36d29750"
notes = "Stand-in for the phone app. Best aim so far (about 16 degrees off on random bodies) but creeps about 1-2 cm/s while turning, and half a turn takes 20-28 s. Some odd bodies (short or long legs, nose-heavy) fall 1 in 3 on big turns."

[[policy]]
slug = "nose-walk-1"
title = "Nose walk v3: back away at a commanded speed"
job = "growbot_nose_walk"
file = "policies/nose-walk-1/policy_nose_walk.json"
run = "6e69e32c"
notes = "Stand-in for the phone app's backing mode: walks nose first (away from the camera) at a commanded speed, though slower than asked (1.9 cm/s when asked 3, 0.5 when asked to stop). Holds a heading within about 90 degrees but rarely turns from dead behind; no falls in its 36 randomised evaluations, 2 in 60 on the odd bodies (slow relay, nose-heavy), and short-legged or nose-heavy bodies fail to turn from 90 degrees."

[[policy]]
slug = "nose-walk-2"
title = "Nose walk, smoothed v1: back away, less leg chatter"
job = "growbot_nose_walk_smooth"
file = "policies/nose-walk-2/policy_nose_walk.json"
run = "37a1a118"
notes = "The backing teacher now: nose-walk-1's own config with jerky leg commands charged 3x harder. Its legs change about a third less per tick (18-21 degrees, against 27-33), and it aims better than nose-walk-1: 22 degrees off on random bodies (34), no falls in 36 randomised evaluations. It backs a little slower at full speed, 1.6 cm/s when asked 3 (nose-walk-1 1.9), though faster averaged over its turns. Still slow to turn from dead behind."

[[policy]]
slug = "lift-fall-1"
title = "Lift and fall v2: walk tall toward a heading"
job = "growbot_lift_fall"
file = "policies/lift-fall-1/policy_lift_fall.json"
run = "ca607df3"
notes = "Walks tall, camera first, at its 5 cm/s cap (no speed input). About 17 degrees off on random bodies and 4 cm/s toward the target; a quarter turn takes about 5 s. 4 falls in 36 randomised evaluations, half of them on half turns."

[[policy]]
slug = "lift-fall-1-16m"
title = "Lift and fall v2 at 16M steps"
job = "growbot_lift_fall"
file = "policies/lift-fall-1-16m/policy_lift_fall.json"
run = "ca607df3"
notes = "The same run's 16M checkpoint, kept for comparison: about 27 degrees off and 5 falls in 36. The final policy (lift-fall-1) beats it."

[[policy]]
slug = "look-v7"
title = "Look v8: turn on the spot to face a target"
job = "growbot_look"
file = "policies/look-v7/policy_look.json"
run = "200aa414"
notes = "The best look so far: 11.5 degrees off on random bodies from every start including 180, half a turn in about 20 s, creeps 0.7 cm/s, and no falls in 36 randomised evaluations or 153 sweep ones; short-legged, nose-heavy and mis-trimmed bodies end 35-47 degrees off from a quarter turn. Keeps a walking person in view less than look-v6 in the follow-me test (56% vs 68%)."

[[policy]]
slug = "lift-fall-2"
title = "Lift and fall, second slot v1: walk tall toward a heading"
job = "growbot_lift_fall_turns"
file = "policies/lift-fall-2/policy_lift_fall.json"
run = "527daab9"
notes = "The forward teacher now: the turning-gated lift and fall at 50M. About 10 degrees off on random bodies and 4.1 cm/s toward the target; half a turn in about 14 s. 3 falls in 36 randomised evaluations, but short-legged and nose-heavy bodies fall on every big turn (50 sweep falls in 153, as many as lift-fall-1), so falls are its main gap. Trained with heading gates main has since dropped: its config is in its folder."

[[policy]]
slug = "lift-fall-3"
title = "Lift and fall v5: walk tall, on the robot as built"
job = "growbot_lift_fall"
file = "policies/lift-fall-3/policy_lift_fall.json"
run = "a0e521dd"
notes = "The forward teacher for the STL-pinned body (Jeff: his robot is the STL): legs as printed, weight and balance point varied a little, servos, floor, delays and trim at 60% of their ranges, paid for keeping a face in the picture. At 37.5M: 1 fall in 100 minute-long walks with the target within 30 degrees, 5.8 cm/s toward it, 5 degrees off, the face in the picture throughout (lift-fall-2 on the same test: 7 falls in 50, 4.3 cm/s). It does not walk on other leg lengths, and turns wider than 30 degrees while walking fall, so the master turns first."

[[policy]]
slug = "look-v9"
title = "Look v10: turn on the spot to face a target"
job = "growbot_look"
file = "policies/look-v9/policy_look.json"
run = "32fae7c5"
notes = "The look teacher now: 10.6 degrees off on random bodies (v7 11.5), and the odd bodies v7 left 35-47 degrees off now end 11-15 off. Quarter turns mostly 7-9 s (short legs from +90 takes 18 s). Half turns about 20 s on random bodies, as v7 (a search for a faster open-loop spin found none that holds up on random bodies). Creeps 0.8 cm/s on target (v7 0.7), which the follower's Hold stops. 0 falls in 36 randomised evaluations; 1 in 153 sweep ones (long legs from 180 degrees, which also ends 64 degrees off)."

[[policy]]
slug = "master-v1"
title = "Master v1: turn, walk and back up, all in one"
job = "growbot_master"
file = "policies/master-v1/policy_master.json"
run = "5e827bc9"
notes = "The first box master (Master v2 replaces it), distilled from look-v9, lift-fall-2 and nose-walk-1, and the first to hold still once it faces the target. Speed 0 turns on the spot; forward walks camera first (within 30 degrees, it turns first otherwise); back backs away nose first (within 45 degrees). Within 3% of those teachers on speed and 2-4 degrees off after a turn, 2-5 cm of drift over the last 15 s of a look, no falls in 45 runs and 1 in 208 mode switches."

[[policy]]
slug = "master-v2"
title = "Master v2: turn, walk and back up, all in one"
job = "growbot_master"
file = "policies/master-v2/policy_master.json"
run = "aa884b2d"
notes = "The master to drive now: distilled on the box from look-v9, lift-fall-3 and nose-walk-1 on the robot as built to the STL, holding still once it faces the target. Walks 5.5-5.8 cm/s camera first (v1 4.7-5.0), backs 2.8-2.9 cm/s nose first, 3-4 degrees off after a turn, 3-5 cm of drift over the last 15 s of a look; no falls in 45 runs or in 181 mode switches."
