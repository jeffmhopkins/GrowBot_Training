# The kept walks JBrain's Body tab offers. Its "Trained walks" sheet has a Refresh that
# reads this file from main, and the box's library then matches it: a new entry is added,
# an entry whose file changed is updated in place (the owner's name and choices for it
# stay), and an entry taken out is removed from the library.
#
# Keep a run with scripts/keep_policy.sh, which copies it to policies/<slug>/ and prints
# the entry to paste here. Only runs worth driving belong here (owner, 2026-11-14: "the
# ones we pick").
#
#   slug   a-z, 0-9 and - (1-48): the folder, and how the box tells entries apart
#   title  the name the Body tab shows first (up to 60 characters)
#   job    the growbot_ training job that made it; the Body tab groups walks by it
#   file   the policy JSON, policies/<folder>/<name>.json
#   run    optional: the Jobs run id it came from
#   notes  optional
#
# tests/test_policies_index.py checks this file the way the box does.

[[policy]]
slug = "look-v6"
title = "Look v6: turn on the spot to face a target"
job = "growbot_look"
file = "policies/look-v6/policy_look.json"
run = "36d29750"
notes = "Stand-in for the phone app. Best aim so far (about 16 degrees off on random bodies) but creeps about 1-2 cm/s while turning, and half a turn takes 20-28 s. Some odd bodies (short or long legs, nose-heavy) fall 1 in 3 on big turns."

[[policy]]
slug = "nose-walk-1"
title = "Nose walk 1: back away at a commanded speed"
job = "growbot_nose_walk"
file = "policies/nose-walk-1/policy_nose_walk.json"
run = "6e69e32c"
notes = "Stand-in for the phone app's backing mode: walks nose first (away from the camera) at a commanded speed, though slower than asked (1.9 cm/s when asked 3, 0.5 when asked to stop). Holds a heading within about 90 degrees but rarely turns from dead behind; no falls in its 36 randomised evaluations."
