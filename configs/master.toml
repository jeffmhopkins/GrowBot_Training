# The master policy job: distils these single-skill teachers into one policy the app runs
# whatever the follower asks, then scores it against them (README "The master policy").
# Not a training config: run.sh sees the [master] table and runs growbot_train.master.
[master]
look = "policies/look-v9/policy_look.json"
walk = "policies/lift-fall-3/policy_lift_fall.json"
back = "policies/nose-walk-1/policy_nose_walk.json"
episodes = 128  # minute-long episodes per round; 64 walked about 20% slow from +25
rounds = [1.0, 0.5, 0.25, 0.0, 0.0]  # how often the teachers drive, per DAgger round
epochs = 40

# The robot is built as the STL (Jeff, 2026-11-15): only the weight and its balance point
# vary, as the walk trained (configs/lift_fall.toml). Look and the nose walk trained on
# wider bodies, which include these. On look's wider bodies lift-fall-3 walked backwards
# and fell in 9 of 18 runs; here it walks 4.7-5.6 cm/s and fell in none of 170 switches.
[master.body]
mass_scale = [0.85, 1.15]
com_x_m = [-0.010, 0.010]
com_y_m = [-0.005, 0.005]
com_z_m = [-0.005, 0.008]
leg_length_scale = [1.0, 1.0]
leg_asymmetry = [1.0, 1.0]
