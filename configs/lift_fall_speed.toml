# GrowBot lift and fall with a speed input: configs/lift_fall.toml (the tall, camera-first
# gait) asked for a speed from a stop up to the cap, the master policy's forward walk.
# Lines marked CHANGED differ from configs/lift_fall.toml.
name = "lift_fall_speed"  # CHANGED: its own name

[reward]
# The reward is added up every control tick (25 per second). Bigger number = the robot
# cares more about that thing. See README "The reward" for what each one does.
progress = 2.0          # walking along the target direction, full value at the speed cap
heading = 0.5           # pointing at the target: full value dead on, zero facing away
heading_width_deg = 0.0  # cosine heading pay: a narrow one (40) left the gait, which turns by arcing, no pay for the arc
progress_width_deg = 0.0  # off: gated progress (45) stopped the arcing turns this gait turns by; at 16M the gated run ended 58 degrees off from a 90-degree start, the ungated one 26-30
arrive = 30.0           # one-off bonus per target that needs a turn, once it has held within 15 degrees for 1 s: 95% if it turns at once, none if it takes 20 s, so a quick turn pays more than a slow one
speed_cap_m_s = 0.07    # CHANGED: 7 cm/s (Jeff, 2026-11-15): room above the gait's 4-5 cm/s, so a full command asks for its fastest
speed_window_s = 1.0    # speed is averaged over this long before the cap is checked
overspeed = 1.0         # penalty for going faster than the cap (grows with the square); gentler, as the one-speed gait goes past slow commands
stop_drift_free = 0.2   # CHANGED: during a stop, drift up to this x the cap is free (1.4 cm/s at the higher cap)
tilt = 1.0              # penalty for leaning away from the taller stance
fall = 10.0             # one-off penalty when it tips past fall_tilt_deg (episode ends)
action_rate = 0.01      # the gait snaps its legs across most of their range; charge that less
effort = 0.01           # small penalty for big leg angles
stance = 0.0            # off: the gait bounces (55-64 degrees as built, up to the 80s on other bodies), so one target height would pay it to stop
stance_tol_deg = 6.0    # how close to the taller stance counts (degrees)
back_lean = 0.0         # off, for the same reason; going over backwards is still a fall
back_lean_margin_deg = 12.0  # how far past the stance before that penalty starts
wobble = 0.0            # penalty for rocking (roll and pitch spin, squared)
turn = 0.5              # pay per degree the heading error shrinks (a clear signal to turn)

[task]
body = "build"              # the printed body with a Pixel on top
surfaces = ["pla", "pla", "pla", "pla"]  # bare print everywhere (see growbot_train/surfaces.py)
start_pitch_deg = 35.0      # set down tail first, as the real one is
servo_torque_nm = 0.25      # an MG90S's real torque (upstream's model allows 1.5)
episode_seconds = 60.0      # a minute, so slow arcing turns can play out before the episode ends
initial_error_deg = 180.0   # first target: up to this many degrees off the camera end
retarget_every_s = [10.0, 25.0]  # the target moves every 10-25 s: this gait turns slowly, and a target that moves before a turn finishes never pays for finishing it...
retarget_max_deg = 120.0        # ...by up to this much
gait_hz = 2.347           # the gait's own rate, so the cloned rhythm lines up with the clock
history_frames = 5          # how many past ticks of sensors the policy sees
action_to_rad = 1.57        # the gait uses the servos' whole range
fall_tilt_deg = 55.0        # tipped this far from the starting stance = fallen (the app aborts at 55)
facing = "camera"           # tail first, toward what the camera sees
stand_lift_deg = 18.0       # it stands at about 61 degrees, 18 above rest
lying_start_prob = 0.0      # share of episodes that start folded flat (off until it can scoot)
lying_leg_rad = [-0.95, -0.75]  # how far both legs tuck for a folded start (radians)
back_fall_pitch_deg = 88.0  # other bodies get thrown up past 80 at times; past 88 is going over onto the screen
speed = "command"           # CHANGED: a speed input, from a stop up to the cap
speed_command_every_s = [3.0, 8.0]  # a new speed this often...
speed_stop_prob = 0.15             # CHANGED: ...3 in 20 of them a stop (stand tall and face it)...
speed_back_min = 0.0               # CHANGED: ...the rest from 0 to +1: backing up is the nose walk's job
speed_ramp_steps = 8000000        # CHANGED: every command at full speed with no stops at first, so the cloned gait pays as it did; the full spread by 8M steps
speed_reward = "progress"          # CHANGED: paid like the cap walk, up to the command, so flailing costs no more than standing (the first speed-input lift and fall, scored on "match", unlearned the gait)
tilt_command = false        # no camera-height input; the gait sets its own height
tilt_lift_deg = [-30.0, 6.0]       # what -1 and +1 mean, degrees from the resting pitch
tilt_command_every_s = [3.0, 8.0]  # a new height this often...
tilt_tall_prob = 0.5               # ...half the time standing tall, otherwise anywhere in range

[randomization]
# Every episode gets a slightly different robot, so the policy works on the real one.
enabled = true
mass_scale = [0.80, 1.25]
com_x_m = [-0.030, 0.030]
com_y_m = [-0.015, 0.015]
com_z_m = [-0.010, 0.015]
leg_length_scale = [0.85, 1.15]
leg_asymmetry = [0.96, 1.04]
servo_gain_scale = [0.75, 1.25]
friction = [0.2, 2.2]        # one friction on every geom, when task.surfaces is empty
floor_friction_scale = [0.5, 1.6]  # with task.surfaces: the whole floor's slickness
servo_slew_rad_s = [8.7, 10.5]
servo_lag_s = [0.015, 0.035]
relay_delay_s = [0.020, 0.160]
servo_torque_scale = [0.5, 1.2]   # torque limit x this: MG90Ss vary
trim_err_rad = 0.087        # each leg's zero off by up to 5 degrees
sensor_delay_s = [0.0, 0.12]  # the phone's readings arrive this late
foot_width_scale = [0.57, 1.0]  # foot width along the body, share of the printed 21 mm
relay_drop_prob = 0.08
imu_tilt_rad = 0.15
accel_noise_m_s2 = 0.3
gyro_noise_rad_s = 0.1
gyro_bias_rad_s = 0.02
heading_noise_deg = 3.0
heading_drift_deg_per_s = 0.25  # slower, so over the minute-long episode the drift stays within the old episode's ±10-15 degrees
heading_refresh_ticks = [1, 6]
push_every_s = [0.0, 0.0]   # a sudden shove this often (off until it can scoot)
push_pitch_rad_s = 0.0      # how hard a shove spins it (pitch, rad/s)
ramp_steps = 25000000      # start near the as-built robot (the gait only works there open loop) and widen to the full ranges over half the run
ramp_from = 0.15            # ...from 15% of each range
ramp_to = 0.35              # but the body ranges stop at 35%: on the box the run walked at 3.8 cm/s near 0.3 and fell apart past about 0.45 (0.6 cm/s by 0.9); the targets still widen to full

[train]
total_steps = 50000000      # starts from a moving gait, so a shorter run
warm_gait = "configs/gaits/lift_fall.json"  # clone the bench's lift-and-fall gait before PPO
n_envs = 0                  # 0 = one simulator per CPU thread
n_steps = 256
batch_size = 4096
n_epochs = 5
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
log_std_init = -1.5         # less exploration noise, so the cloned gait's timing survives the first updates
policy_layers = [128, 128]
value_layers = [256, 256]
checkpoint_every_steps = 2000000
# How often the live folder's 3D replay and policy_latest.json are refreshed from the
# current network (a pause of a second or two each time; a few minutes apart on the box).
live_replay_every_steps = 500000
seed = 0
