# GrowBot look: stand in place and turn to face a direction, holding the camera steady.
# The camera walk at speed 0 already does this; this one never has to walk, so it can be
# trained harder for a steady view and for turning. Try it if the camera walk wobbles
# when it stops. Everything else is the camera walk's (camera_walk.toml); only the lines
# marked CHANGED differ from that file.
#   python -m growbot_train.train --out runs/x --config configs/look.toml
name = "look"

[reward]
# The reward is added up every control tick (25 per second). Bigger number = the robot
# cares more about that thing. See README "The reward" for what each one does.
progress = 2.0          # here only a cost: drifting more than stop_drift_free x the cap
heading = 1.5           # CHANGED: facing the target is the whole job here
speed_cap_m_s = 0.03    # CHANGED: 3 cm/s. Look never walks, so the cap only sets how much drift a turn may have
speed_window_s = 1.0    # speed is averaged over this long before the cap is checked
overspeed = 4.0         # CHANGED: penalty for going faster than the cap (grows with the square)
stop_drift_free = 0.5   # CHANGED: drift up to this x the cap is free (1.5 cm/s)
tilt = 1.0              # penalty for leaning away from the taller stance
fall = 10.0             # one-off penalty when it tips past fall_tilt_deg (episode ends)
action_rate = 0.05      # penalty for jerky leg commands (change since last tick, squared)
effort = 0.01           # small penalty for big leg angles
stance = 0.5            # as camera walk: bonus for standing taller than at rest
stance_tol_deg = 6.0    # how close to the taller stance counts (degrees)
back_lean = 2.0         # as camera walk: penalty for leaning back past the stance + margin
back_lean_margin_deg = 12.0  # how far past the stance before that penalty starts
wobble = 0.05           # CHANGED: penalty for rocking, for a steady camera
turn = 1.0              # CHANGED: pay per degree the heading error shrinks; turning is the whole job

[task]
body = "build"              # CHANGED: the printed body with a Pixel on top (2026-11-14); "rollout"/"olie" are upstream's sim bodies
surfaces = ["pla", "pla", "pla", "pla"]  # CHANGED: tail, belly, tail-side and nose-side halves of each foot: bare print (see growbot_train/surfaces.py)
floors = ["hard", "carpet"] # each episode on one of these floors
start_pitch_deg = 35.0      # CHANGED: set down tail first, as the real one is (level, the printed build balances on its soles)
servo_torque_nm = 0.25      # CHANGED: an MG90S's real torque (upstream's model allows 1.5)
episode_seconds = 30.0      # as camera walk: longer, so each episode holds several commands
initial_error_deg = 180.0   # first target: up to this many degrees off the camera end
retarget_every_s = [5.0, 12.0]  # CHANGED: the target moves every 5-12 s (turning on the spot is ~8 deg/s)...
retarget_max_deg = 120.0        # ...by up to this much
gait_hz = 1.0               # CHANGED: the clock the policy sees; about one turning step a second
history_frames = 5          # how many past ticks of sensors the policy sees
action_to_rad = 1.0         # full action = 1 radian (~57 degrees) of leg swing
fall_tilt_deg = 55.0        # tipped this far from the starting stance = fallen (the app aborts at 55)
facing = "camera"           # as camera walk: tail first, toward what the camera sees
stand_lift_deg = 6.0        # as camera walk: about all this body can lift (see README)
lying_start_prob = 0.0      # as camera walk: off for now
lying_leg_rad = [-0.95, -0.75]  # how far both legs tuck for a folded start (radians)
back_fall_pitch_deg = 75.0  # as camera walk: past 75 degrees nose-up counts as falling over backwards
speed = "still"             # CHANGED: never walk, only turn on the spot (no speed input)
speed_command_every_s = [3.0, 8.0]  # a new speed this often...
speed_stop_prob = 0.3              # ...3 in 10 of them a stop (turn on the spot to face it)...
speed_back_min = -1.0              # ...the rest anywhere from backing away at full speed to +1
tilt_command = true         # as camera walk: a camera-height input: -1 low (camera looks almost straight up), +1 tall
tilt_lift_deg = [-30.0, 6.0]       # what -1 and +1 mean, degrees from the resting pitch
tilt_command_every_s = [3.0, 8.0]  # a new height this often...
tilt_tall_prob = 0.5               # ...half the time standing tall, otherwise anywhere in range

[randomization]
# Every episode gets a slightly different robot, so the policy works on the real one.
enabled = true
mass_scale = [0.80, 1.25]
com_x_m = [-0.030, 0.030]
com_y_m = [-0.015, 0.015]
com_z_m = [-0.010, 0.015]
leg_length_scale = [0.85, 1.15]
leg_asymmetry = [0.96, 1.04]
servo_gain_scale = [0.75, 1.25]
friction = [0.6, 1.4]
servo_slew_rad_s = [8.7, 10.5]
servo_lag_s = [0.015, 0.035]
relay_delay_s = [0.020, 0.090]
relay_drop_prob = 0.08
imu_tilt_rad = 0.15
accel_noise_m_s2 = 0.3
gyro_noise_rad_s = 0.1
gyro_bias_rad_s = 0.02
heading_noise_deg = 3.0
heading_drift_deg_per_s = 0.5
heading_refresh_ticks = [1, 6]
push_every_s = [0.0, 0.0]   # as camera walk: off for now
push_pitch_rad_s = 0.0      # as camera walk: off for now

[train]
total_steps = 40000000      # CHANGED: no walking to learn, so a shorter run
n_envs = 0                  # 0 = one simulator per CPU thread
n_steps = 256
batch_size = 4096
n_epochs = 5
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
log_std_init = -0.5
policy_layers = [128, 128]
value_layers = [256, 256]
checkpoint_every_steps = 2000000
# How often the live folder's 3D replay and policy_latest.json are refreshed from the
# current network (a pause of a second or two each time; a few minutes apart on the box).
live_replay_every_steps = 500000
seed = 0
