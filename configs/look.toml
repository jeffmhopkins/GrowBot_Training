# GrowBot look: stand in place and turn to face a direction, holding the camera steady.
# The camera walk at speed 0 already does this; this one never has to walk, so it can be
# trained harder for a steady view and for turning. Try it if the camera walk wobbles
# when it stops. Everything else is the camera walk's (camera_walk.toml); only the lines
# marked CHANGED differ from that file.
#   python -m growbot_train.train --out runs/x --config configs/look.toml
name = "look"

[reward]
# The reward is added up every control tick (25 per second). Bigger number = the robot
# cares more about that thing. See README "The reward" for what each one does.
progress = 2.0          # here only a cost: drifting more than stop_drift_free x the cap
heading = 3.0           # CHANGED: facing the target is the whole job here...
heading_width_deg = 40.0  # CHANGED: ...and it pays only near it (exp(-(error/40)^2)): sitting 60 degrees off earns a tenth, not the cosine's three quarters
progress_width_deg = 0.0  # with > 0: progress pays only while pointing near the target (exp(-(error/width)^2))
arrive = 0.0            # one-off bonus per target for reaching it quickly (0 = off). v8 with it at 30 (and a firmer anchor, 1.0) aimed worse than v7 (15 degrees vs 11.5, worst from +90 on odd bodies) and turned no faster
speed_cap_m_s = 0.03    # CHANGED: 3 cm/s. Look never walks, so the cap only sets how much drift a turn may have
speed_window_s = 1.0    # speed is averaged over this long before the cap is checked
overspeed = 4.0         # CHANGED: penalty for going faster than the cap (grows with the square)
stop_drift_free = 0.8   # CHANGED: drift up to this x the cap is free (2.4 cm/s). This body drifts more the faster it spins (about 1.2 cm/s at the open-loop spin's 15 degrees a second on random bodies, more above), so at 0.5 the squared overspeed charge capped how fast it turned: v7 took 20 s for half a turn where the cloned spin manages 12-15 s. Standing still on target is the follower's Hold (follow.py), which stops creep there outright
anchor = 0.4            # CHANGED: back to v7's; wandering from where this turn began costs, up to this per tick, full at 15 cm past anchor_free_m (1.0 in v8 bought nothing)
anchor_free_m = 0.02    # ...the first 2 cm free
tilt = 4.0              # CHANGED: penalty for leaning away from the stance; firm, so it turns instead of leaning
fall = 10.0             # one-off penalty when it tips past fall_tilt_deg (episode ends)
action_rate = 0.05      # penalty for jerky leg commands (change since last tick, squared)
effort = 0.01           # small penalty for big leg angles
stance = 1.0            # CHANGED: bonus for holding the asked camera height; at 0.5 the run before ignored the height input
stance_tol_deg = 6.0    # how close to the taller stance counts (degrees)
back_lean = 2.0         # as camera walk: penalty for leaning back past the stance + margin
back_lean_margin_deg = 12.0  # how far past the stance before that penalty starts
wobble = 0.05           # CHANGED: penalty for rocking, for a steady camera
frame = 2.0             # CHANGED: keep the person's face in the phone's picture, and once stopped centre it (the aim averaged over a second): look's stop is where the follower needs the face dead ahead. v9 lands 7 degrees off centre on random bodies; this asks for tighter
turn = 1.0              # CHANGED: pay per degree the heading error shrinks; turning is the whole job

[task]
body = "build"              # CHANGED: the printed body with a Pixel on top (2026-11-14); "rollout"/"olie" are upstream's sim bodies
surfaces = ["pla", "pla", "pla", "pla"]  # CHANGED: tail, belly, tail-side and nose-side halves of each foot: bare print (see growbot_train/surfaces.py)
floors = ["hard", "carpet"] # each episode on one of these floors
start_pitch_deg = 35.0      # CHANGED: set down tail first, as the real one is (level, the printed build balances on its soles)
servo_torque_nm = 0.25      # an MG90S's real torque (upstream's model allows 1.5)
episode_seconds = 60.0      # CHANGED: a minute, so an episode still holds two to four of the longer commands below
initial_error_deg = 180.0   # first target: up to this many degrees off the camera end
retarget_every_s = [15.0, 30.0]  # CHANGED: the target moves every 15-30 s: half a turn takes 10 s or more at 17 degrees a second, so this leaves time to get there and hold it...
retarget_max_deg = 180.0        # CHANGED: ...by up to half a turn, so it learns to face what is behind it
gait_hz = 1.0               # CHANGED: the clock the policy sees; about one turning step a second
history_frames = 5          # how many past ticks of sensors the policy sees
action_to_rad = 1.45        # CHANGED: full action = 1.45 radians (~83 degrees, the servo stops at 90): room either side of the still spin's 1.25 rad swing (less once the camera-height offset is added)
fall_tilt_deg = 55.0        # tipped this far from the starting stance = fallen (the app aborts at 55)
facing = "camera"           # as camera walk: tail first, toward what the camera sees
heading_from = "lens"       # CHANGED: facing is scored on the worse of where the camera points and where the body points, so a lean earns nothing
stand_lift_deg = 6.0        # as camera walk: about all this body can lift (see README)
lying_start_prob = 0.0      # as camera walk: off for now
lying_leg_rad = [-0.95, -0.75]  # how far both legs tuck for a folded start (radians)
back_fall_pitch_deg = 75.0  # as camera walk: past 75 degrees nose-up counts as falling over backwards
speed = "still"             # CHANGED: never walk, only turn on the spot (no speed input)
speed_command_every_s = [3.0, 8.0]  # a new speed this often...
speed_stop_prob = 0.3              # ...3 in 10 of them a stop (turn on the spot to face it)...
speed_back_min = -1.0              # ...the rest anywhere from backing away at full speed to +1
speed_ramp_steps = 0              # with a speed input: start every command at full speed, widen over this many steps (0 = off)
speed_reward = "match"              # with a speed input: "match" the commanded velocity, or "progress" like the cap walk (forward only)
tilt_command = true         # as camera walk: a camera-height input: -1 low (camera looks almost straight up), +1 tall
tilt_lift_deg = [-20.0, 6.0]       # CHANGED: -1 and +1 in degrees from the resting pitch; not as low, so the lens never looks straight up and loses its heading
tilt_command_every_s = [8.0, 20.0]  # CHANGED: a new height this often, slower too so a height change doesn't land mid-turn every few seconds...
tilt_tall_prob = 0.5               # ...half the time standing tall, otherwise anywhere in range

[randomization]
# Every episode gets a slightly different robot, so the policy works on the real one.
enabled = true
ramp_steps = 15000000      # CHANGED: start near the as-built robot (the cloned spin only works there open loop) and widen to the full ranges by 15M steps
mass_scale = [0.80, 1.25]
com_x_m = [-0.030, 0.030]
com_y_m = [-0.015, 0.015]
com_z_m = [-0.010, 0.015]
leg_length_scale = [0.85, 1.15]
leg_asymmetry = [0.96, 1.04]
servo_gain_scale = [0.75, 1.25]
friction = [0.2, 2.2]        # one friction on every geom, when task.surfaces is empty
floor_friction_scale = [0.5, 1.6]  # with task.surfaces: the whole floor's slickness
servo_slew_rad_s = [8.7, 10.5]
servo_lag_s = [0.015, 0.035]
relay_delay_s = [0.020, 0.160]
servo_torque_scale = [0.5, 1.2]   # torque limit x this: MG90Ss vary
trim_err_rad = 0.087        # each leg's zero off by up to 5 degrees
sensor_delay_s = [0.0, 0.12]  # the phone's readings arrive this late
foot_width_scale = [0.57, 1.0]  # foot width along the body, share of the printed 21 mm
relay_drop_prob = 0.08
imu_tilt_rad = 0.15
accel_noise_m_s2 = 0.3
gyro_noise_rad_s = 0.1
gyro_bias_rad_s = 0.02
heading_noise_deg = 3.0
heading_drift_deg_per_s = 0.5
heading_refresh_ticks = [1, 6]
push_every_s = [0.0, 0.0]   # as camera walk: off for now
push_pitch_rad_s = 0.0      # as camera walk: off for now

[train]
total_steps = 40000000      # CHANGED: no walking to learn, so a shorter run
n_envs = 0                  # 0 = one simulator per CPU thread
envs_per_worker = 4         # CHANGED: four simulators per worker process, so the cores stay busy
n_steps = 64                # CHANGED: a quarter of 256, so 4x the simulators keep the rollout the same size
batch_size = 4096
n_epochs = 5
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
log_std_init = -1.5         # CHANGED: less exploration noise, so the cloned spin's timing survives the first updates
policy_layers = [128, 128]
value_layers = [256, 256]
checkpoint_every_steps = 2000000
# How often the live folder's 3D replay and policy_latest.json are refreshed from the
# current network (a pause of a second or two each time; a few minutes apart on the box).
live_replay_every_steps = 500000
warm_gait = "configs/gaits/look_spin_still.json"  # CHANGED: clone a spin on the spot before PPO...
warm_gait_steer = true      # CHANGED: ...steered: spin toward the target, stand still on it
warm_gait_samples = 400000  # CHANGED: twice the samples...
warm_gait_epochs = 120      # CHANGED: ...and three times the passes: the steered clone switches direction, harder to fit than a walk
warm_gait_tilt_offset = [-0.4, 0.27]  # CHANGED: the clone lowers or raises both legs with the camera height input (camera about 68 up at -1; at +1 about 47 when steered, 54 spinning nonstop: the spin can't stand much taller, PPO has to find the rest)
seed = 0
