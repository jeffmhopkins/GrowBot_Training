# GrowBot nose-first walk at a commanded speed: the heading walk (configs/heading_walk.toml)
# with a speed input, so the master policy can back away from the camera at any speed up
# to the cap. Every line that differs from the heading walk says CHANGED.
# Anything left out falls back to the defaults in growbot_train/config.py. Override one
# value for a single run without editing this file:
#   python -m growbot_train.train --out runs/x --set reward.speed_cap_m_s=0.04
name = "nose_walk"  # CHANGED: the run's name

[reward]
# The reward is added up every control tick (25 per second). Bigger number = the robot
# cares more about that thing. See README "The reward" for what each one does.
progress = 2.0          # walking along the target direction, full value at the speed cap
heading = 0.5           # pointing at the target: full value dead on, zero facing away
heading_width_deg = 0.0  # cosine heading pay, as the lift and fall: a cloned gait turns by arcing, and a narrow pay leaves the arc unpaid
progress_width_deg = 0.0  # off, for the same reason (the lift and fall's gated run turned worse)
arrive = 30.0           # CHANGED: one-off bonus per target that needs a turn, once it has held within 15 degrees for 1 s, less the longer it took (none after 20 s)
speed_cap_m_s = 0.03    # "slow": 3 cm/s. Upstream's forward walk does about 3.6 cm/s
speed_window_s = 1.0    # speed is averaged over this long before the cap is checked
overspeed = 4.0         # penalty for going faster (total speed) than the command or the free band, whichever is higher (grows with the square); 20 froze run 5e2f5518 (0.2 cm/s, 79 degrees off by 7M steps, overspeed outweighing progress)
stop_drift_free = 0.2   # CHANGED: speed up to this x the cap (0.6 cm/s, not 1.5) is never charged as overspeed, at a stop or a slow command: at 0.5 any command under half the cap could walk 1.5 cm/s free. Stops are for standing still; the master spins with look
tilt = 0.3              # CHANGED: penalty for leaning away from how it stood at the start: lighter, as the cloned waddle runs about 22 degrees under that (0.07 a tick at 1.0, pushing it back up); falls still end the episode
fall = 10.0             # one-off penalty when it tips past fall_tilt_deg (episode ends)
action_rate = 0.5       # CHANGED: as look (2026-11-16): nose-walk-1 commands 30-60 degrees of change a tick. Half look's charge, since its 2-3 Hz gait needs bigger steps
effort = 0.01           # small penalty for big leg angles
stance = 0.0            # bonus for standing taller than at rest (off: this walk keeps its stance)
stance_tol_deg = 6.0    # how close to the taller stance counts (degrees)
back_lean = 0.0         # penalty for leaning back past the stance + margin (off here)
back_lean_margin_deg = 12.0  # how far past the stance before that penalty starts
anchor = 0.5            # CHANGED: wandering from where a stop began (or the target last moved) costs up to this per tick (past 2 cm), so a stop stays a stop
wobble = 0.0            # penalty for rocking (roll and pitch spin, squared; off here)
turn = 0.5              # CHANGED: pay per degree the heading error shrinks (a clear signal to turn)

[task]
body = "build"              # the printed body with a Pixel on top; "rollout"/"olie" are upstream's sim bodies
surfaces = ["pla", "pla", "pla", "pla"]  # tail, belly, tail-side and nose-side halves of each foot: bare print (see growbot_train/surfaces.py)
floors = ["hard", "carpet"] # each episode on one of these floors
start_pitch_deg = 35.0      # set down tail first, as the real one is (level, the printed build balances on its soles)
servo_torque_nm = 0.25      # an MG90S's real torque (upstream's model allows 1.5)
episode_seconds = 60.0      # CHANGED: a minute, so slow turns and speed changes can play out
initial_error_deg = 60.0    # CHANGED: first target up to 60 degrees off: wider turns are the look policy's spin, which the master hands them to (the nose walk only backs away from the camera)
retarget_every_s = [10.0, 25.0]  # CHANGED: the target moves every 10-25 s, long enough for a slow turn to finish...
retarget_max_deg = 60.0         # CHANGED: ...by up to this much, for the same reason
gait_hz = 0.906             # CHANGED: the waddle's own rate
residual_gait = "configs/gaits/nose_walk.json"  # CHANGED: the bench's low nose-first waddle (search.py n2: about 12 degrees nose-up, 3.1 cm/s with no falls on random robots) always runs; the policy adds corrections and steering. Cloned instead (a810ca07), PPO drifted off it to 1.3-1.8 cm/s by 15M
residual_rad = 0.5          # the most the policy moves a leg off the gait (radians)
residual_steer_deg = 20.0   # CHANGED: steering built into the base: one leg out by up to 0.5 rad as the observed error reaches 20 degrees (alone it holds 15-23 degrees off on random robots at 2.4-2.8 cm/s along; PPO from scratch, 7cf329f3, was still 47 off at 7.5M), so PPO refines it
history_frames = 5          # how many past ticks of sensors the policy sees
action_to_rad = 1.57        # CHANGED: the waddle uses the servos' whole range
fall_tilt_deg = 55.0        # tipped this far from the starting stance = fallen (the app aborts at 55)
facing = "nose"             # which end walks first: "nose", or "camera" (the tail end)
stand_lift_deg = 0.0        # stand this many degrees more nose-up than at rest
lying_start_prob = 0.0      # share of episodes that start folded flat
lying_leg_rad = [-0.95, -0.75]  # how far both legs tuck for a folded start (radians)
back_fall_pitch_deg = 0.0   # count leaning past this pitch as falling backwards (0 = off)
speed = "command"           # CHANGED: a speed input: 0 stop, up to +1 the cap, always nose first
speed_command_every_s = [6.0, 15.0]  # CHANGED: a new speed every 6-15 s, so it has time to reach one before the next...
speed_stop_prob = 0.15             # CHANGED: ...3 in 20 of them a stop (the master policy spins and looks at 0)...
speed_back_min = 0.0               # CHANGED: ...the rest anywhere from 0 to +1: it only walks nose first
speed_ramp_steps = 0       # every command from the start: the speed sets the waddle's step rate, so slow and stopped walks need no learning first
speed_reward = "progress"  # CHANGED: paid like the heading walk up to the commanded speed, so flailing early costs no more than keeping still
tilt_command = false        # a camera-height input: -1 low (camera looks almost straight up), +1 tall
tilt_lift_deg = [-30.0, 6.0]       # what -1 and +1 mean, degrees from the resting pitch
tilt_command_every_s = [3.0, 8.0]  # a new height this often...
tilt_tall_prob = 0.5               # ...half the time standing tall, otherwise anywhere in range

[randomization]
# Every episode gets a slightly different robot, so the policy works on the real one.
enabled = true
mass_scale = [0.80, 1.25]
com_x_m = [-0.030, 0.030]
com_y_m = [-0.015, 0.015]
com_z_m = [-0.010, 0.015]
leg_length_scale = [0.85, 1.15]
leg_asymmetry = [0.96, 1.04]
servo_gain_scale = [0.75, 1.25]
friction = [0.2, 2.2]        # one friction on every geom, when task.surfaces is empty
floor_friction_scale = [0.5, 1.6]  # with task.surfaces: the whole floor's slickness
servo_slew_rad_s = [8.7, 10.5]
servo_lag_s = [0.015, 0.035]
relay_delay_s = [0.020, 0.160]
servo_torque_scale = [0.5, 1.2]   # torque limit x this: MG90Ss vary
trim_err_rad = 0.087        # each leg's zero off by up to 5 degrees
sensor_delay_s = [0.0, 0.12]  # the phone's readings arrive this late
foot_width_scale = [0.57, 1.0]  # foot width along the body, share of the printed 21 mm
relay_drop_prob = 0.08
imu_tilt_rad = 0.15
accel_noise_m_s2 = 0.3
gyro_noise_rad_s = 0.1
gyro_bias_rad_s = 0.02
heading_noise_deg = 3.0
heading_drift_deg_per_s = 0.2  # CHANGED: slower, so over the minute-long episode the drift stays within the old episode's ±10-15 degrees
heading_refresh_ticks = [1, 6]
push_every_s = [0.0, 0.0]   # a sudden shove this often (off here)
push_pitch_rad_s = 0.0      # how hard a shove spins it (pitch, rad/s)
ramp_steps = 5000000       # CHANGED: the robots widen to the full ranges over the first 5M steps (the waddle walks on all of them, but the corrections are learned first where it walks best)
ramp_from = 0.15
ramp_to = 1.0               # where the body ranges stop widening (the targets still go to full)

[train]
total_steps = 30000000
n_envs = 0                  # 0 = one simulator per CPU thread
envs_per_worker = 4         # CHANGED: four simulators per worker process, so the cores stay busy (as the look)
n_steps = 64                # CHANGED: a quarter of 256, so 4x the simulators keep the rollout the same size
batch_size = 4096
n_epochs = 5
learning_rate = 3e-4
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
ent_coef = 0.0
log_std_init = -1.5         # CHANGED: little exploration noise: the gait does the walking, so the corrections start small
policy_layers = [128, 128]
value_layers = [256, 256]
checkpoint_every_steps = 2000000
# How often the live folder's 3D replay and policy_latest.json are refreshed from the
# current network (a pause of a second or two each time; a few minutes apart on the box).
live_replay_every_steps = 500000
seed = 0
